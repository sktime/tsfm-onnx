<!doctype html>
<!--
  t0-alpha in the browser — markup only.
  Behavior lives in js/ (ES modules, entry point js/main.js);
  styles in css/style.css. See webdemo/README.md for the architecture.

  Serve the REPO ROOT so the model + data files are reachable:
      python -m http.server 8000   ->   http://localhost:8000/webdemo/
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>t0-alpha browser forecast — ONNX vs library</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>t0-alpha — client-side forecasting, checked against the PyTorch library</h1>

  <div class="controls">
    <span>
      <label>Model:</label>
      <label><input type="radio" name="model" value="int8" checked> int8 (108&nbsp;MB)</label>
      <label><input type="radio" name="model" value="fp32"> fp32 (411&nbsp;MB)</label>
    </span>
    <span>
      <label for="dataset">Dataset:</label>
      <select id="dataset"></select>
    </span>
    <span>
      <label for="csv">or upload CSV:</label>
      <input type="file" id="csv" accept=".csv,text/csv">
    </span>
    <!-- Appears only when an uploaded CSV has several numeric columns. -->
    <span id="column-wrap" hidden>
      <label for="column">Column:</label>
      <select id="column"></select>
    </span>
  </div>

  <p id="status">loading…</p>
  <p id="note"></p>

  <canvas id="plot" width="1900" height="720"></canvas>

  <div class="legend">
    <span><span class="swatch" style="background:#2b3440"></span>history (context)</span>
    <span><span class="swatch" style="background:#9aa3ad"></span>actual future (held out)</span>
    <span><span class="swatch" style="background:#1d6ee0"></span>ONNX median + 10–90 / 25–75 bands</span>
    <span><span class="swatch swatch-dashed"></span>library (PyTorch) median</span>
  </div>

  <div id="metrics"></div>

  <!-- onnxruntime-web as a classic script tag (defines the global `ort`).
       Deliberately NOT an ES import: the UMD bundle configures its own
       .wasm file paths relative to the CDN, so there is zero build step. -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
